<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nota social image source</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("../public/dm-sans-latin.woff2");
        font-weight: 400 700;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #faf9f6;
        color: #292824;
        font-family: "DM Sans", sans-serif;
        padding: 66px 78px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 29px;
        font-weight: 650;
      }
      header img {
        width: 52px;
        height: 52px;
      }
      header span {
        color: #716d65;
        font-size: 15px;
        font-weight: 400;
        margin-left: 4px;
      }
      h1 {
        margin: 52px 0 24px;
        font-size: 75px;
        line-height: 1.1;
        letter-spacing: -4px;
        font-weight: 500;
      }
      h1 span {
        color: #858073;
      }
      p {
        color: #716d65;
        font-size: 21px;
        line-height: 1.6;
      }
      footer {
        margin-top: 42px;
        padding-top: 24px;
        border-top: 1px solid #e8e5de;
        color: #716d65;
        font-size: 17px;
      }
      footer span {
        padding: 0 18px;
        color: #aaa292;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../src/assets/icon.png" alt="" />Nota <span>for Mac</span>
    </header>
    <h1>A little notepad.<br /><span>Room for everything.</span></h1>
    <p>
      A native Mac notepad for quick thoughts, text files,<br />and everything
      you’re reading.
    </p>
    <footer>
      Native macOS<span>·</span>Open source<span>·</span>No login required
    </footer>
  </body>
</html>
